services:
  - type: web
    name: safe-or-sure
    runtime: python
    plan: free
    buildCommand: pip install caspian-sdk
    startCommand: python game.py
    envVars:
      # The "up late?" greeting reads the host clock, so pin it to the
      # audience's zone instead of the box's UTC.
      - key: TZ
        value: Asia/Kolkata
      - key: CASPIAN_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: FEATHERLESS_API_KEY
        sync: false
      - key: DISCORD_INVITE_URL
        sync: false
      - key: PLAYER_EMAIL
        sync: false
      - key: PLAYER_DISCORD_ID
        sync: false
